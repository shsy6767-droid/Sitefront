<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storefront — Free High-Converting Websites For Local Businesses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14201F;
    --teal:#0F6B5C;
    --teal-deep:#0B2B29;
    --gold:#F2B134;
    --coral:#FF6B4A;
    --paper:#F7F4EC;
    --paper-deep:#EDE7D6;
    --line:#DFD6BE;
    --slate:#5B655F;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:'Space Grotesk', sans-serif;
    margin:0;
    letter-spacing:-0.015em;
  }
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px; position:relative; width:100%;}
  section{padding:56px 0;}
  .lede{color:var(--slate); font-size:16px; max-width:520px;}
  .eyebrow{
    display:inline-block; font-size:13px; color:var(--teal); font-weight:600;
    margin-bottom:12px;
  }

  /* Nav */
  .navbar{
    position:sticky; top:0; z-index:30;
    background:rgba(247,244,236,0.95);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    width: 100%;
  }
  .navbar .wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:12px; padding-bottom:12px; gap:12px;
  }
  .logo{font-family:'Space Grotesk', sans-serif; font-weight:800; font-size:20px; flex-shrink:0;}
  .logo span{color:var(--teal);}
  .navlinks{display:flex; gap:18px; align-items:center;}
  .navlinks a{font-size:14px; color:var(--ink); text-decoration:none; white-space:nowrap;}
  .navlinks a:hover{color:var(--teal);}
  
  @media (max-width: 639px) {
    .navlinks a:not(.btn) {
      display: none;
    }
  }

  /* Buttons & Touch Targets */
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--teal); color:white;
    padding:12px 20px; border-radius:6px; font-size:14.5px; font-weight:600;
    text-decoration:none; border:none; cursor:pointer; font-family:'IBM Plex Sans', sans-serif;
    min-height:44px; touch-action:manipulation; flex-shrink:0; white-space:nowrap;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{background:var(--teal-deep); transform:translateY(-1px);}
  .btn.gold{background:var(--gold); color:var(--ink);}
  .btn.gold:hover{background:#dd9c22;}
  .btn.small{padding:8px 14px; font-size:13.5px; min-height:36px;}
  .btn.ghost{background:var(--paper-deep); color:var(--ink);}
  .btn.ghost:hover{background:var(--line); transform:none;}

  /* Hero Grid Layout */
  .hero{padding-top:60px; padding-bottom:60px; position:relative;}
  .glow{
    position:absolute; width:100%; max-width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle, rgba(15,107,92,0.20), rgba(242,177,52,0.10) 55%, transparent 70%);
    top:-220px; right:-140px; z-index:0; filter:blur(10px);
    pointer-events:none;
  }
  .hero .wrap{
    display:grid; grid-template-columns:1fr; gap:48px; align-items:center; z-index:1;
  }
  @media (min-width: 768px) {
    .hero .wrap {
      grid-template-columns: 1.2fr 1fr;
    }
  }
  
  .hero-copy{opacity:0; animation:rise .7s ease forwards;}
  .hero-copy.d3{animation-delay:.24s;}
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .hero h1{
    font-size:clamp(36px, 5vw, 54px); line-height:1.1; font-weight:800; margin-bottom:16px;
  }
  .hero h1 em{font-style:normal; color:var(--teal);}
  .hero .lede{margin-bottom:24px; font-size:16.5px;}
  .hero-actions{display:flex; gap:12px; align-items:stretch; flex-direction:column;}
  @media (min-width: 480px) {
    .hero-actions { flex-direction: row; }
  }
  
  .live-count{
    margin-top:20px; font-size:13.5px; color:var(--slate); display:flex; align-items:center; gap:8px;
  }
  .live-dot{width:8px; height:8px; border-radius:50%; background:var(--coral); display:inline-block; flex-shrink:0;}

  /* Form Container Design */
  .form-container {
    background: white; border-radius: 10px; border: 1px solid var(--line);
    box-shadow: 0 12px 30px rgba(11,43,41,0.08); padding: 32px;
  }
  .form-container h2 { font-size: 24px; margin-bottom: 8px; font-weight: 700; }
  .form-container p { font-size: 14.5px; color: var(--slate); margin: 0 0 24px 0; }
  
  .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
  @media (min-width: 480px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
  }
  
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .field-group input, .field-group textarea {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; font-size: 14.5px; background: var(--paper); color: var(--ink);
  }
  .field-group input:focus, .field-group textarea:focus {
    outline: 2px solid var(--teal); background: white;
  }
  .form-container .btn { width: 100%; justify-content: center; margin-top: 12px; }
  .form-note { text-align: center; font-size: 12.5px; color: var(--slate); margin-top: 12px; }

  /* Problem Section */
  .problem{background:var(--paper-deep); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .problem .wrap{display:grid; grid-template-columns:1fr; gap:32px; align-items:start;}
  @media (min-width: 768px) {
    .problem .wrap { grid-template-columns: 1fr 1fr; gap: 64px; }
  }
  .problem h2{font-size:clamp(24px, 4vw, 32px); margin-bottom:12px;}
  .stat-list{display:flex; flex-direction:column; gap:18px;}
  .stat{display:flex; gap:14px; align-items:baseline;}
  .stat .num{font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:28px; color:var(--teal); min-width:64px;}
  .stat .desc{font-size:14px; color:var(--slate);}

  /* How it works */
  .steps-section .wrap { display: grid; grid-template-columns: 1fr; gap: 40px; }
  @media (min-width: 768px) {
    .steps-section .wrap { grid-template-columns: 1fr 1.2fr; gap: 64px; }
  }
  .steps{width: 100%;}
  .step{display:flex; gap:16px; padding:20px 0; border-top:1px solid var(--line);}
  .step:last-child{border-bottom:1px solid var(--line);}
  .step .n{font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:20px; color:var(--gold); min-width:28px;}
  .step h3{font-size:17px; margin-bottom:4px;}
  .step p{font-size:14px; color:var(--slate); margin:0;}

  /* Included features grid */
  .included { background: white; }
  .included .wrap{display:grid; grid-template-columns:1fr; gap:32px;}
  @media (min-width: 768px) {
    .included .wrap { grid-template-columns: 1fr 1.5fr; gap: 64px; }
  }
  .checklist{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr; gap:16px;}
  @media (min-width: 480px) {
    .checklist { grid-template-columns: 1fr 1fr; }
  }
  .checklist li{font-size:14.5px; padding-left:24px; position:relative; font-weight: 500;}
  .checklist li::before{content:"✓"; position:absolute; left:0; top:0; color:var(--teal); font-weight:700;}

  /* Spotlight / directory */
  .spotlight{background:var(--teal-deep); color:white; position:relative; overflow:hidden;}
  .spotlight-glow{
    position:absolute; width:500px; height:500px; border-radius:50%;
    background:radial-gradient(circle, rgba(242,177,52,0.22), transparent 68%);
    bottom:-260px; left:-160px;
  }
  .spotlight .wrap{position:relative; z-index:1;}
  .spotlight-head{display:flex; flex-direction:column; justify-content: space-between; gap:18px; margin-bottom:36px;}
  @media (min-width: 768px) {
    .spotlight-head { flex-direction: row; align-items: flex-end; }
  }
  .spotlight-head .btn{align-self:flex-start;}
  .spotlight h2{color:white; font-size:clamp(24px, 4vw, 34px); margin-bottom:8px;}
  .spotlight .lede{color:#D6E7E3;}
  
  .directory-grid{display:grid; grid-template-columns:1fr; gap:20px;}
  @media (min-width: 640px) {
    .directory-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 900px) {
    .directory-grid { grid-template-columns: 1fr 1fr 1fr; }
  }
  
  .biz-card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:8px; padding:20px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .biz-card.new{animation:pulseIn .6s ease;}
  @keyframes pulseIn{ from{box-shadow:0 0 0 0 rgba(242,177,52,0.55);} to{box-shadow:0 0 0 14px rgba(242,177,52,0);} }
  .biz-swatch{width:32px; height:32px; border-radius:6px; margin-bottom:12px;}
  .biz-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; margin-bottom: 2px;}
  .biz-type{font-size:12px; color:#AFC7C3; margin-bottom:12px; font-weight: 500;}
  .biz-desc{font-size:14px; color:#DCEBE8; margin-bottom:16px; flex-grow: 1;}
  .biz-link{font-size:13px; color:var(--gold); word-break:break-word; text-decoration: none; font-weight: 600;}
  .biz-link:hover{text-decoration: underline;}
</style>
</head>
<body>

  <!-- Nav Bar -->
  <nav class="navbar">
    <div class="wrap">
      <div class="logo">Store<span>front</span></div>
      <div class="navlinks">
        <a href="#problem">The Problem</a>
        <a href="#process">Our Process</a>
        <a href="#blueprint" class="btn small gold">Apply For A Free Site</a>
      </div>
    </div>
  </nav>

  <!-- Main Hero & Application Section -->
  <section class="hero">
    <div class="glow"></div>
    <div class="wrap">
      
      <div class="hero-copy">
        <span class="eyebrow">COMMUNITY PORTFOLIO INITIATIVE</span>
