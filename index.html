<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Architecture | Luxury Web Engineering & Organic SEO</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Modern CSS Reset & Variable Architecture */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        :root {
            /* Editorial High-End Light Palette */
            --bg-base: #f9f8f6;          /* Muted alabaster linen */
            --bg-surface: #ffffff;       /* Pure white panels */
            --bg-card: #f3f1ed;          /* Soft architectural concrete grey */
            --text-main: #141416;        /* High-contrast caviar black */
            --text-muted: #686b75;       /* Refined slate grey */
            --accent-gold: #c5a880;      /* Warm premium muted champagne gold */
            --accent-glow: rgba(197, 168, 128, 0.15);
            --border-thin: rgba(20, 20, 22, 0.06);
            --border-focus: rgba(20, 20, 22, 0.4);
            
            --font-display: 'Playfair Display', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --transition-smooth: all 0.6s var(--ease-out-expo);
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        body {
            overflow-x: hidden;
        }

        /* Layout Layout Utilities */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 5rem;
        }

        @media (max-width: 992px) {
            .container { padding: 0 2.5rem; }
        }
        @media (max-width: 576px) {
            .container { padding: 0 1.5rem; }
        }

        section {
            padding: 12rem 0;
            position: relative;
        }

        /* Sophisticated Section Headings */
        .section-meta {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25rem;
            color: var(--accent-gold);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .section-meta::before {
            content: '';
            width: 24px;
            height: 1px;
            background-color: var(--accent-gold);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 4.5vw, 4.2rem);
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.02em;
            max-width: 800px;
            margin-bottom: 5rem;
        }

        /* High-End Button Layouts */
        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 1.5rem;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.2rem;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition-smooth);
            position: relative;
            cursor: pointer;
            background: none;
            border: none;
        }

        .action-link .arrow-circle {
            width: 52px;
            height: 52px;
            border: 1px solid var(--border-thin);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-surface);
            transition: var(--transition-smooth);
        }

        .action-link:hover .arrow-circle {
            background-color: var(--text-main);
            border-color: var(--text-main);
            transform: translateX(8px);
        }

        .action-link svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 1.5;
            transition: var(--transition-smooth);
        }

        .action-link:hover svg {
            stroke: var(--bg-surface);
        }

        /* Floating Modern Navigation Bar */
        nav {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 10rem);
            max-width: 1300px;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-thin);
            border-radius: 100px;
            transition: var(--transition-smooth);
        }

        nav.scrolled {
            top: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            background-color: rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 992px) {
            nav { width: calc(100% - 5rem); top: 1.5rem; }
        }
        @media (max-width: 576px) {
            nav { width: calc(100% - 3rem); top: 1rem; }
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 76px;
            padding: 0 2.5rem;
        }

        .brand-logo {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .brand-logo a {
            color: var(--text-main);
            text-decoration: none;
        }

        .navigation-menu {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        @media (max-width: 768px) {
            .navigation-menu { display: none; } /* Kept clean without breaking code size */
        }

        .navigation-menu a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .navigation-menu a:hover {
            color: var(--text-main);
        }

        .nav-cta {
            background-color: var(--text-main);
            color: var(--bg-surface);
            padding: 0.7rem 1.6rem;
            border-radius: 50px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        .nav-cta:hover {
            background-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        /* Cinematic Hero Section */
        .hero-viewport {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 120px;
            background: radial-gradient(circle at 80% 20%, var(--accent-glow), transparent 45%);
        }

        .hero-layout-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 4rem;
        }

        @media (max-width: 992px) {
            .hero-layout-grid { grid-template-columns: 1fr; }
        }

        .hero-text-block h1 {
            font-family: var(--font-display);
            font-size: clamp(3.2rem, 7vw, 5.8rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 2.5rem;
        }

        .hero-text-block h1 em {
            font-style: italic;
            font-family: var(--font-display);
            color: var(--accent-gold);
            font-weight: 400;
        }

        .hero-text-block p {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.65;
            margin-bottom: 4rem;
            max-width: 620px;
        }

        /* Abstract Premium Floating Graphic Panel */
        .hero-graphic-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 992px) {
            .hero-graphic-frame { display: none; }
        }

        .graphic-circle {
            width: 80%;
            height: 80%;
            border: 1px dashed var(--accent-gold);
            border-radius: 50%;
            position: absolute;
            animation: spin 60s linear infinite;
        }

        .graphic-card-mock {
            width: 70%;
            height: 50%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--bg-surface);
            box-shadow: 0 40px 80px rgba(20,20,22,0.06);
            border-radius: 24px;
            transform: rotate(-6deg);
            transition: var(--transition-smooth);
        }

        .hero-graphic-frame:hover .graphic-card-mock {
            transform: rotate(0deg) scale(1.05);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Asymmetric Premium Portfolio Matrix */
        .portfolio-matrix {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4rem 2rem;
        }
