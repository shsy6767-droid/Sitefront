<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Design | Premium Web Studio & SEO Architecture</title>
    <!-- Google Fonts for Elegant Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0a0a0a;
            --bg-card: #121212;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --accent: #d4af37; /* Gold accent */
            --border-color: rgba(255, 255, 255, 0.07);
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        body {
            overflow-x: hidden;
        }

        /* Layout Structure */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 4rem;
        }

        @media (max-width: 768px) {
            .container { padding: 0 1.5rem; }
        }

        section {
            padding: 10rem 0;
            border-top: 1px solid var(--border-color);
        }

        /* Reusable Typography & Visual Anchors */
        .section-header {
            margin-bottom: 5rem;
            max-width: 700px;
        }

        .section-header span {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            color: var(--accent);
            display: block;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .section-header h2 {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 400;
            line-height: 1.1;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.15rem;
            text-transform: uppercase;
            transition: var(--transition);
            background: transparent;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--text-primary);
            color: var(--bg-color);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 90px;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .logo a {
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 90px;
            border-top: none;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 400;
            line-height: 1.05;
            margin-bottom: 2.5rem;
        }

        .hero h1 em {
            font-style: italic;
            color: var(--accent);
        }

        .hero p {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: var(--text-secondary);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 3.5rem;
            max-width: 650px;
        }

        /* Portfolio Grid */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4rem;
        }

        @media (max-width: 768px) {
            .portfolio-grid { grid-template-columns: 1fr; gap: 3rem; }
        }

        .project-card {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project-image {
            width: 100%;
            aspect-ratio: 4/5;
            background-color: var(--bg-card);
            overflow: hidden;
            margin-bottom: 1.5rem;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .project-image::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #161616 25%, transparent 25%) -25px 0,
                        linear-gradient(225deg, #161616 25%, transparent 25%) -25px 0,
                        linear-gradient(45deg, #111, #1a1a1a);
            background-size: 50px 50px;
            transition: var(--transition);
        }

        .project-card:hover .project-image::before {
            transform: scale(1.03);
            filter: brightness(1.2);
        }

        .project-card h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }

        .project-card:hover h3 { color: var(--accent); }

        .project-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Process Steps Section */
        .process-steps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3rem;
        }

        @media (max-width: 992px) {
            .process-steps { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .process-steps { grid-template-columns: 1fr; }
        }

        .step-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 3rem 2.5rem;
            transition: var(--transition);
        }

        .step-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .step-num {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            display: block;
        }

        .step-card h3 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 1rem;
        }

        .step-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Pricing Architecture Grid */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
            align-items: start;
        }

        @media (max-width: 992px) {
            .pricing-grid { grid-template-columns: 1fr; max-width: 550px; margin: 0 auto; }
        }

        .tier-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 3.5rem 2.5rem;
            position: relative;
        }

        .tier-card.featured {
            border: 1px solid var(--accent);
        }

        .badge {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--accent);
            color: var(--bg-color);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            padding: 0.3rem 0.8rem;
            font-weight: 600;
        }

        .tier-card h3 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .tier-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .price {
            font-family: var(--font-serif);
            font-size: 3rem;
            color: var(--text-primary);
            margin-bottom: 2.5rem;
            display: block;
        }

        .price span {
            font-size: 1rem;
            font-family: var(--font-sans);
            color: var(--text-secondary);
        }

        .features-list {
            list-style: none;
            margin-bottom: 3rem;
        }

        .features-list li {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .features-list li::before {
