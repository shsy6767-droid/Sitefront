<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Design Studio | Premium Web Design</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #1f2833;
            --text-main: #f5f5f7;
            --text-muted: #c5a880;
            --accent: #66fcf1;
            --accent-dim: #45b1e8;
            --surface: #12141c;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- Header & Navigation --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background: rgba(11, 12, 16, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 2.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
            opacity: 0.8;
        }

        nav a:hover, nav a.active {
            color: var(--accent);
            opacity: 1;
        }

        .cta-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .cta-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
        }

        /* --- Hero Section --- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
            position: relative;
            background: radial-gradient(circle at 50% 40%, rgba(102, 252, 241, 0.07) 0%, transparent 50%);
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            max-width: 900px;
        }

        .hero h1 span {
            font-style: italic;
            font-weight: 600;
            background: linear-gradient(45deg, var(--accent), var(--accent-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: #a0a5b5;
            max-width: 600px;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* --- Global Sections Layout --- */
        section {
            padding: 8rem 10%;
        }

        .section-header {
            margin-bottom: 4rem;
            text-align: center;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: #a0a5b5;
            font-size: 1rem;
        }

        /* --- Services Grid --- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .service-card {
            background: var(--surface);
            padding: 3rem 2rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 252, 241, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .service-card i {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .service-card h3 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .service-card p {
            color: #a0a5b5;
            font-size: 0.95rem;
        }

        /* --- Portfolio Showcase --- */
        .portfolio-tabs {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #a0a5b5;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            transition: var(--transition);
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active, .tab-btn:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2.5rem;
        }

        .portfolio-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 4/3;
            background: var(--surface);
        }

        /* Using CSS gradients as placeholders for premium mockups */
        .portfolio-item .mock-img {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255,255,255,0.05);
            transition: var(--transition);
        }

        .portfolio-item:nth-child(2) .mock-img { background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); }
        .portfolio-item:nth-child(3) .mock-img { background: linear-gradient(135deg, #111 0%, #555 100%); }

        .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem;
            background: linear-gradient(transparent, rgba(11, 12, 16, 0.95));
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }

        .portfolio-item:hover .portfolio-overlay {
            transform: translateY(0);
            opacity: 1;
        }

        .portfolio-item:hover .mock-img {
            transform: scale(1.05);
        }

        .portfolio-overlay h4 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .portfolio-overlay p {
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Contact Form Section --- */
        .contact-container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--surface);
            padding: 3.5rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.6rem;
            color: #a0a5b5;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.04);
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 1.2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .submit-btn:hover {
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.4);
            transform: translateY(-2px);
        }

        /* --- Footer --- */
        footer {
            padding: 4rem 10%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
